<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/i18n.js" defer></script><link rel="stylesheet" href="/theme.css"><title>CenterEK • Giriş</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3fa;font-family:Segoe UI,Arial;display:grid;place-items:center;min-height:100vh;color:#23384e}.box{width:min(92vw,420px);background:white;border:1px solid #dbe5ef;border-radius:16px;padding:38px;box-shadow:0 15px 50px #12304c0e}h1{font-size:32px;margin:0 0 8px}h1 span{color:#2e8dca}p{color:#75869b;font-size:14px;line-height:1.6}label{display:block;font-size:13px;margin-top:22px}input{width:100%;padding:12px;border:1px solid #cddae7;border-radius:7px;margin-top:8px;font:inherit}button{width:100%;background:#23699e;color:white;border:0;border-radius:7px;padding:13px;font:inherit;margin-top:26px;cursor:pointer}#error{color:#aa344b;font-size:13px}small{display:block;color:#8897a8;font-size:11px;margin-top:24px}</style><div class="box"><h1>Center<span>EK</span></h1><p>Altyapı izleme çalışma alanına giriş yapın.</p><form id="login"><label for="username">Kullanıcı adı</label><input id="username" autocomplete="username" required maxlength="64"><label for="password">Parola</label><input id="password" type="password" autocomplete="current-password" required maxlength="256"><div id="error" role="alert"></div><button id="submit">Giriş yap</button></form><small>Panel hesabınız AD hesabınızdan ayrıdır.</small></div><script>document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('submit');b.disabled=true;try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});if(r.ok){location.replace('/');return}document.getElementById('error').textContent=r.status===429?'Çok sayıda başarısız deneme. 5 dakika sonra tekrar deneyin.':'Giriş yapılamadı. Bilgilerinizi kontrol edin.'}catch{document.getElementById('error').textContent='Sunucuya ulaşılamıyor.'}finally{b.disabled=false;document.getElementById('password').value=''}});</script></html>
