name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  infrastructure:
    name: Validate Azure infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile Bicep without Azure credentials or deployment
        run: |
          az bicep install --version v0.48.1
          az bicep build --file infra/azure/main.bicep --outfile /tmp/centerek-azure.json
          az bicep build --file infra/azure/identity.bicep --outfile /tmp/centerek-identity.json

  verify:
    name: Verify Windows / Python ${{ matrix.python }}
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt -r requirements-tls.txt
      - name: Backend and security regression tests
        run: |
          New-Item -ItemType Directory data -Force | Out-Null
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: UI and language behavior
        run: |
          foreach ($file in Get-ChildItem web/*.js) {
            node --check $file.FullName
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          node tests/test_switch_ui.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/test_i18n.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Parse all PowerShell scripts without executing them
        shell: powershell
        run: ./scripts/ci/Test-PowerShell.ps1
      - name: Summary
        if: always()
        shell: pwsh
        run: |
          "### Windows / Python $env:PYTHON_VERSION" >> $env:GITHUB_STEP_SUMMARY
          "Result: ${{ job.status }}; commit: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY

  package:
    name: Package and HTTPS smoke test
    needs: [verify, infrastructure]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'EnsarKarayel/CenterEK'
    runs-on: windows-2022
    timeout-minutes: 25
    outputs:
      artifact: centerek-windows-${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-tls.txt -r requirements-build.txt
      - name: Build the self-contained installer
        run: |
          python build_windows.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $release=(Get-ChildItem data/releases -Directory | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          "RELEASE_DIR=$release" >> $env:GITHUB_ENV
          $manifest=Get-Content (Join-Path $release 'release-manifest.json') -Raw|ConvertFrom-Json
          $manifest|Add-Member -NotePropertyName commit -NotePropertyValue $env:GITHUB_SHA -Force
          $manifest|ConvertTo-Json -Depth 8|Set-Content (Join-Path $release 'release-manifest.json') -Encoding utf8
      - name: Test packaged authentication TLS and connectors
        run: |
          $exe=Join-Path $env:RELEASE_DIR 'dist/CenterEK-Setup/CenterEK-Setup.exe'
          $report=Join-Path $env:RELEASE_DIR 'self-test.json'
          $process=Start-Process $exe -ArgumentList @('--self-test','--report',('"'+$report+'"')) -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -or -not (Get-Content $report -Raw|ConvertFrom-Json).ok) { throw 'Packaged self-test failed' }
          python tests/smoke_frozen.py --bundle "$env:RELEASE_DIR/dist/CenterEK-Setup" --report "$env:RELEASE_DIR/smoke-report.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/ci/check_archive.py "$env:RELEASE_DIR"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: centerek-windows-${{ github.sha }}
          path: |
            ${{ env.RELEASE_DIR }}/*.zip
            ${{ env.RELEASE_DIR }}/*.sha256
            ${{ env.RELEASE_DIR }}/*manifest.json
            ${{ env.RELEASE_DIR }}/*test.json
            ${{ env.RELEASE_DIR }}/*report.json
          if-no-files-found: error
          retention-days: 14

  azure-staging:
    name: Deploy Azure staging
    needs: [verify, infrastructure, package]
    if: github.repository == 'EnsarKarayel/CenterEK' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AZURE_DEPLOY_ENABLED == 'true'
    environment: azure-staging
    runs-on: windows-2022
    timeout-minutes: 25
    concurrency:
      group: azure-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: centerek-windows-${{ github.sha }}
          path: deploy-artifact
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy verified package through Azure VM agent
        shell: pwsh
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_VM_NAME: ${{ vars.AZURE_VM_NAME }}
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_KEY_VAULT: ${{ vars.AZURE_KEY_VAULT }}
          AZURE_CLIENT_CIDR: ${{ vars.AZURE_CLIENT_CIDR }}
        run: ./scripts/azure/Deploy-Azure.ps1 -ArtifactFolder deploy-artifact -Commit $env:GITHUB_SHA
      - name: Deployment summary
        if: always()
        shell: pwsh
        run: |
          "### Azure staging: ${{ job.status }}" >> $env:GITHUB_STEP_SUMMARY
          "Commit: $env:GITHUB_SHA. Guest result: see deployment step. Production is not deployed by this workflow." >> $env:GITHUB_STEP_SUMMARY
